name: Publish Hidden Page Reader v6.6

on:
  push:
    tags:
      - v6.6

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v6.6
          release-assets/Hidden-Page-Reader-v6.6-Windows-x64.zip
          --title "隐页阅读器 v6.6"
          --notes "Windows x64 免安装版。新增可配置的鼠标静止悬停显示延迟，默认 2 秒。"
          --verify-tag
